[package]
name = "zipp_rb"
version = "0.0.0"
edition = "2021"
publish = false

# Ruby native extension: a Rust cdylib that embeds the Zipp engine and exposes
# it as ZippRb::VM. `zipp-vm` is the in-tree engine under engine/ (upstream
# Zipp plus engine/LOCAL_CHANGES.md); `instrument` is enabled so the
# resource-limit surface is compiled in.
[lib]
crate-type = ["cdylib"]

[dependencies]
# `rb-sys`: `magnus::rb_sys::protect` (deliver pending interrupts without a
# longjmp through Rust frames) and raw VALUE access (cycle detection).
magnus = { version = "0.8", features = ["rb-sys"] }
rb-sys = "0.9"
# The in-tree engine. The gem ships engine/, so this path resolves in an
# installed gem as it does in the checkout.
#
# Without the `jit` feature: a VM with a deadline (every dommy VM) never ran
# the aarch64 JIT, and page scripts are eval programs the JIT never compiles.
# Without it the heap also drops the x86-64 JIT's per-slot mirrors (32 bytes
# a slot; see engine/LOCAL_CHANGES.md).
#
# With `safe-sandbox`: the engine (and its regex engine) is built with
# `forbid(unsafe_code)`, so an engine bug is a panic — which poisons that VM —
# rather than memory corruption. A SharedArrayBuffer is agent-local there
# (engine/LOCAL_CHANGES.md); a VM has one agent, so nothing can tell.
zipp-vm = { path = "../../engine/crates/zipp-vm", default-features = false, features = ["instrument", "safe-sandbox"] }
