# Workspace root for the in-tree Zipp engine crates (not part of the upstream
# import). Upstream's root manifest spans crates this repository does not
# vendor, so this one lists only the four that zipp-rb builds and mirrors the
# `[workspace.package]` / `[workspace.dependencies]` entries they inherit.
# bin/engine-import reports when upstream changes those entries.
[workspace]
resolver = "2"
members = [
    "crates/zipp-vm",
    "crates/regress-fork",
    "crates/zipp-numparse",
    "crates/zipp-pyparse",
]

[workspace.package]
version = "0.0.23"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
rustc-hash = "2"
dynasm = "5.1"
dynasmrt = "5.1"
