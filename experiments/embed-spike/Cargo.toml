[package]
name = "embed-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Phase 0 spike for the Zipp Ruby-binding plan. Pure Rust: it exercises the
# zipp-vm embed API directly, with no Ruby involved, to establish which of the
# plan's required contracts the current public API can and cannot satisfy.
#
# The dependency is a path into the local zipp.org checkout at commit
# 0b4d26e6 (v0.0.23). `instrument` is enabled so the resource-limit surface
# (set_limits / set_heap_limit / set_dynamic_code_limits / ResourceUsage) is
# compiled in; default features keep the native JIT on.
[[bin]]
name = "embed-spike"
path = "src/main.rs"

[dependencies]
zipp-vm = { path = "../../vendor/zipp/crates/zipp-vm", features = ["instrument"] }
